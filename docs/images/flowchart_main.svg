<text x="534" y="646.5" font-size="13" text-anchor="start" fill="#111827">3 — найти студента</text>
<text x="534" y="662.5" font-size="13" text-anchor="start" fill="#111827">4 — редактировать студента</text>
<text x="534" y="678.5" font-size="13" text-anchor="start" fill="#111827">5 — удалить студента</text>
<text x="534" y="694.5" font-size="13" text-anchor="start" fill="#111827">6 — выставить оценку</text>
<text x="534" y="710.5" font-size="13" text-anchor="start" fill="#111827">7 — показать оценки студента</text>
